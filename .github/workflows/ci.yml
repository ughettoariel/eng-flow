name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  OXLINT_VERSION: 1.93.0
  OXFMT_VERSION: 0.78.0
  GITLEAKS_VERSION: 8.30.1

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - run: npx -y oxlint@${{ env.OXLINT_VERSION }} .
      - run: npx -y oxfmt@${{ env.OXFMT_VERSION }} --check
      - name: gitleaks over the tree and the history
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" dir . --redact --verbose
          "$RUNNER_TEMP/gitleaks" git . --redact --verbose
